name: Deploy GUI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Dioxus CLI cache
        id: dioxus-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dioxus-cli-0.7.10

      - name: Install Dioxus CLI
        if: steps.dioxus-cli-cache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the GUI
        working-directory: gui
        run: >-
          dx build --release --web --package track-time-tagger-gui
          --base-path "${{ github.event.repository.name }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/dx/track-time-tagger-gui/release/web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
