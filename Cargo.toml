[package]
name = "track-time-tagger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Match image EXIF timestamps to a FIT or GPX GPS track"

[workspace]
members = ["core", "gui"]
resolver = "2"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
fitparser = "0.11"
gpx = "0.10"
kamadak-exif = "0.6"
little_exif = "0.6"
walkdir = "2"
