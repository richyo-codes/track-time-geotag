[package]
name = "track-time-tagger-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Optional local-first Dioxus GUI for Track Time Tagger"

[dependencies]
base64 = "0.22"
dioxus = "0.7.10"
dioxus-html = "0.7.10"
serde_json = "1"
track-time-tagger-core = { path = "../core" }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Blob", "Document", "HtmlAnchorElement", "Url", "Window"] }
zip = { version = "2.4.2", default-features = false }

[features]
default = ["web"]
web = ["dioxus/web", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
desktop = ["dioxus/desktop"]
